apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: omarnasser777/flask-app:fce280dba2ea0fc1649d42c7296a0c81fb551ba3
          ports:
            - containerPort: 5000
